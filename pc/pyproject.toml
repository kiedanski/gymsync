[project]
name = "gymsync"
version = "0.1.0"
description = "BLE GATT peripheral daemon receiving gym data from an Amazfit GTR 4"
requires-python = ">=3.10"
dependencies = [
    "bless>=0.3.0",
    "pyyaml>=6.0",
]

[project.scripts]
gymsync = "gymsync.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gymsync"]
